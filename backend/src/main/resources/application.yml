spring:
  application:
    name: gonggomoa

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

gonggomoa:
  collector:
    moef:
      base-url: https://apis.data.go.kr/1051000/recruitment
      service-key: ${MOEF_SERVICE_KEY}
      ncs-cd-lst: R600020,R600002
      hire-type-lst: R1010,R1030,R1070
      num-of-rows: 100
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      max-retries: 3
      retry-backoff-ms: 500
      rate-limit-threshold: 100
    discord-alert:
      webhook-url: ${DISCORD_WEBHOOK_URL:}
      failure-threshold: 3
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
      max-retries: 3
      retry-backoff-ms: 500
